name: Android Build

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_NDK_VERSION: "26.3.11579264"
  CMAKE_VERSION: "3.22.1"
  PRODUCTION_APK_URL: "https://f-droid.org/repo/com.darkempire78.opencalculator_53.apk"
  PRODUCTION_APK_SHA256: "2642613868a8a80f0ce963a4863bc153e7281b97b3bbdf36ca92a99dded7134a"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK, NDK, and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-29" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: Stage pinned production APK
        run: |
          mkdir -p host/src/main/assets
          curl --fail --location --retry 3 --output /tmp/production-guest.apk "$PRODUCTION_APK_URL"
          echo "$PRODUCTION_APK_SHA256  /tmp/production-guest.apk" | sha256sum --check --strict
          cp /tmp/production-guest.apk host/src/main/assets/production-guest.apk

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Regenerate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Compile test plugin
        run: ./gradlew --no-daemon :test-plugin:assembleDebug

      - name: Stage test plugin APK into host assets
        run: |
          mkdir -p host/src/main/assets
          cp test-plugin/build/outputs/apk/debug/test-plugin-debug.apk \
             host/src/main/assets/test_plugin.apk

      - name: Derive trusted plugin signing fingerprint
        run: |
          fingerprint="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs \
            test-plugin/build/outputs/apk/debug/test-plugin-debug.apk \
            | awk -F': ' '/SHA-256 digest/{print $2; exit}')"
          test -n "$fingerprint"
          echo "SANDBOX_PLUGIN_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"

      - name: Build sandbox-core and host APK
        run: ./gradlew --no-daemon :sandbox-core:testDebugUnitTest :sandbox-core:assembleDebug :host:assembleDebug -PsandboxPluginFingerprint="$SANDBOX_PLUGIN_FINGERPRINT"

      - name: Prepare downloadable app-debug.apk
        run: cp host/build/outputs/apk/debug/host-debug.apk host/build/outputs/apk/debug/app-debug.apk

      - name: Upload host APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: host/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test plugin APK
        uses: actions/upload-artifact@v4
        with:
          name: test-plugin-debug
          path: test-plugin/build/outputs/apk/debug/test-plugin-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: build-${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" \
            host/build/outputs/apk/debug/app-debug.apk \
            test-plugin/build/outputs/apk/debug/test-plugin-debug.apk \
            --target "$GITHUB_SHA" \
            --title "Android Build ${{ github.run_number }}" \
            --notes "Automated successful build for commit $GITHUB_SHA.\n\nArtifacts:\n- app-debug.apk: host application\n- test-plugin-debug.apk: test plugin APK\n\nWorkflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
